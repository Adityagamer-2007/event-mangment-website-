<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client & Partner Registration — AfroSynthese</title>
  <meta name="description" content="Register your client or partner account with AfroSynthese to access private event galleries, download high-resolution masters, and review invoices.">
  <link rel="icon" type="image/png" href="assets/logos/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background-color:#0A0A0A;">

  <!-- Site Header -->
  <header class="site-header scrolled">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo" aria-label="AfroSynthese Home">
        <img src="assets/logos/logo.png" alt="AfroSynthese Logo">
      </a>
      <div class="header-actions">
        <a href="index.html" class="btn btn-secondary btn-sm">Return to Website</a>
      </div>
    </div>
  </header>

  <main style="padding-top: calc(var(--header-height) + 2rem); min-height: 85vh; display:flex; align-items:center; justify-content:center;">
    <div class="container" style="max-width:540px;">
      
      <div class="tilt-card reveal-on-scroll" style="background:var(--bg-secondary); border:1px solid var(--border-gold); padding:3rem; box-shadow:0 25px 60px rgba(0,0,0,0.8);">
        <div style="text-align:center; margin-bottom:2rem;">
          <img src="assets/logos/logo.png" alt="AfroSynthese Official Logo" style="height:44px; margin:0 auto 1.25rem;">
          <span class="eyebrow">NEW ACCOUNT</span>
          <h2 style="font-size:2rem; margin-top:0.25rem;">Client Registration</h2>
          <p style="font-size:0.85rem; color:var(--text-secondary); margin-top:0.4rem;">
            Create an account to manage event bookings and download deliverables.
          </p>
        </div>

        <form id="registerForm">
          <div class="form-group">
            <label class="form-label" for="regName">Full Name</label>
            <input type="text" id="regName" class="form-control" placeholder="e.g. Jean-Luc Fontaine" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="regEmail">Email Address</label>
            <input type="email" id="regEmail" class="form-control" placeholder="client@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="regPhone">Phone / WhatsApp</label>
            <input type="tel" id="regPhone" class="form-control" placeholder="+49 ...">
          </div>
          <div class="form-group" style="margin-bottom:2rem;">
            <label class="form-label" for="regPassword">Create Password</label>
            <input type="password" id="regPassword" class="form-control" placeholder="••••••••••••" required>
          </div>

          <button type="submit" class="btn btn-gold" style="width:100%; margin-bottom:1.5rem;">
            Create Account & Enter Portal →
          </button>
        </form>

        <div style="text-align:center; font-size:0.82rem; color:var(--text-muted); border-top:1px solid var(--border-subtle); padding-top:1.5rem;">
          Already have an account? <a href="login.html" style="color:var(--accent-gold);">Sign In to Portal</a>
        </div>
      </div>

    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/navigation.js"></script>
  <script>
    document.getElementById('registerForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value;
      if (window.showToast) window.showToast(`Account registered for ${name}! Entering Client Portal...`);
      setTimeout(() => {
        window.location.href = 'client-dashboard.html';
      }, 700);
    });
  </script>
</body>
</html>
